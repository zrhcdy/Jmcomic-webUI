    <script>
        //page init setting
        (function () {
            const banner = document.querySelector(".banner");
            const bannerInner = banner.querySelector(".br-inner");
            const bannerItemWidth = bannerInner.children[0].offsetWidth;
            const bannerWidth = banner.offsetWidth;

            bannerInner.style.transitionDuration = "0s";
            bannerInner.style.transform = `translateX(${(bannerWidth - bannerItemWidth) / 2}px)`;
            //dom update
            bannerInner.getBoundingClientRect();
            bannerInner.style.transitionDuration = null;
        })();
        (function () {
            const tagContainerDom = document.querySelector(".tag-cr");
            const items = tagContainerDom.children;
            let width = 90;
            if (tagContainerDom.offsetWidth < 500) {
                width = 75;
            }
            let count = Math.floor(tagContainerDom.offsetWidth / width);
            if (count > items.length) {
                count = items.length;
            }
            for (let i = 0; i < items.length; i++) {
                if (i > items.length - count - 1) {
                    items[i].style.display = "block";
                } else {
                    items[i].style.display = "none";
                }
            }
        })();
    </script>
